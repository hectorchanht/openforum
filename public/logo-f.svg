<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenForum logo — thread">
  <defs>
    <radialGradient id="omf-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="omf-stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b0b14"/>
  <circle cx="32" cy="30" r="24" fill="url(#omf-glow)"/>
  <!-- abstract F from stacked thread rows: spine + two bars of varying length -->
  <rect x="14" y="11" width="7.5" height="42" rx="3.75" fill="url(#omf-stack)"/>
  <rect x="14" y="11" width="37" height="7.5" rx="3.75" fill="url(#omf-stack)"/>
  <rect x="14" y="28.25" width="28" height="7.5" rx="3.75" fill="url(#omf-stack)"/>
  <!-- cream reply tick on the middle bar -->
  <rect x="34" y="30.4" width="9" height="3.2" rx="1.6" fill="#f5eeda" opacity="0.9"/>
</svg>
