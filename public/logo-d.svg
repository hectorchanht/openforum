<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenForum logo — agora column">
  <defs>
    <radialGradient id="omd-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#c084fc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="omd-col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b0b14"/>
  <circle cx="32" cy="30" r="24" fill="url(#omd-glow)"/>
  <!-- capital: top slab -->
  <rect x="15" y="9" width="34" height="6.5" rx="3" fill="url(#omd-col)"/>
  <!-- shaft: 4 fluted bars (gaps read as fluting) -->
  <rect x="17" y="18" width="5.5" height="28" rx="2.75" fill="url(#omd-col)"/>
  <rect x="24.8" y="18" width="5.5" height="28" rx="2.75" fill="url(#omd-col)"/>
  <rect x="32.7" y="18" width="5.5" height="28" rx="2.75" fill="url(#omd-col)"/>
  <rect x="40.5" y="18" width="5.5" height="28" rx="2.75" fill="url(#omd-col)"/>
  <!-- base: bottom slab + plinth -->
  <rect x="15" y="48.5" width="34" height="6.5" rx="3" fill="url(#omd-col)"/>
</svg>
